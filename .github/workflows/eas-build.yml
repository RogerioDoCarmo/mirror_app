name: EAS Build & Submit

# ⚠️ NOTHING AUTOMATIC STARTS A PAID BUILD HERE. This workflow is dispatch-only
# on purpose, and the purpose has an autopsy behind it in both repositories.
#
# It used to run on every push to main that touched src/**, app.json,
# package.json or the lockfile — path-filtered, which reads as careful and is
# not. main here is fed by "Merge pull request #NNN from RogerioDoCarmo/develop"
# merges, and those merges touch package.json or the lockfile nearly every time
# (#162, #164 and #167 all did). Each match ran `eas build --platform all`: two
# remote builds, one Android and one iOS, bought for a dependency bump nobody
# thought of as a release.
#
# ⚠️ THE NUMBERS, READ OFF THIS REPOSITORY'S OWN RUN HISTORY. In 47 runs of this
# workflow, every single one was triggered by a push and not one by a human. 30
# of them finished, which is roughly 60 build credits nobody requested. 16
# failed, and six of those failed the expensive way described below — four of
# them in a single afternoon on 12 September.
#
# The sibling repo morse_app carried the identical trigger and narrowed it to
# release tags after five merges in one evening cost seven iOS builds out of
# fifteen a month. Here it is narrowed further, to `workflow_dispatch`, because a
# tag is still a git operation nobody associates with a spend, and both binaries
# can be produced for nothing: `pnpm build:aab:local` / `pnpm build:ipa:local`,
# and the Mac archives the IPA in Xcode. EAS earns its credit only when neither
# machine can do the job.
#
# ⚠️ `cancel-in-progress` below does NOT refund anything. A remote EAS build
# runs on EAS infrastructure, not on this runner; cancelling the Actions run
# abandons the log, not the build, and the credit is already gone. That is why
# the fix had to be at the trigger and not at the concurrency group.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options: [all, ios, android]
      submit:
        description: 'Submit to stores after build'
        required: true
        default: false
        type: boolean
      credits_available:
        description: 'EAS credits confirmed remaining? (see the paid-builds notes)'
        required: true
        default: 'no'
        type: choice
        options: ['no', 'yes']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict the default GITHUB_TOKEN to read-only so that no job in this
# workflow can accidentally write to the repository or create releases.
permissions:
  contents: read

jobs:
  # ⚠️ THE BUILD NUMBER IS SPENT BEFORE THE CREDIT IS CHECKED.
  #
  # eas.json sets `appVersionSource: "remote"` and the production profile sets
  # `autoIncrement: true`, so EAS holds versionCode/buildNumber and increments
  # them as the first thing `eas build` does — then checks the plan.
  #
  # ⚠️ It has already happened here six times. The run for #167 on 20 September
  # logged `✔ Incremented versionCode from 56 to 57` at 20:00:24 and, three
  # seconds later, `This account has used its builds from the Free plan this
  # month`, then `Error: build command failed.` Identical shape on 48→49, 49→50,
  # 52→53, 54→55 and 55→56. Six Android versionCodes spent on nothing, and
  # nothing in a repository can put them back — morse_app lost Android 16 and
  # iOS 19 the same way on 23 September.
  #
  # So the question "are there credits?" has to be answered BEFORE EAS is asked
  # for a build number, and the only place that can happen is here, in front of
  # the job that runs the CLI. There is no EAS command that reports the
  # remaining allowance, so this is a human answer typed at dispatch time rather
  # than something queried — the value of it is that the counter cannot move
  # without someone having looked at the plan page first.
  #
  # Same shape as check-version in firebase-distribution.yml: a gate job that
  # skips the expensive job cleanly instead of failing it red, so a deliberate
  # "not now" does not look like a broken pipeline.
  check-credits:
    name: Check EAS credits were confirmed
    runs-on: ubuntu-latest
    outputs:
      confirmed: ${{ steps.check.outputs.confirmed }}
    steps:
      - name: Require an explicit confirmation before EAS allocates a version
        id: check
        env:
          CONFIRMED: ${{ inputs.credits_available }}
        run: |
          if [ "$CONFIRMED" = "yes" ]; then
            echo "Credits confirmed; the build may ask EAS for a version."
            echo "confirmed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "confirmed=false" >> "$GITHUB_OUTPUT"
          {
            echo "### No build was started"
            echo
            echo "\`credits_available\` was **$CONFIRMED**, so this run stopped"
            echo "before the CLI could ask EAS for a version — the remote"
            echo "versionCode/buildNumber is untouched. Read the remaining"
            echo "allowance on the EAS plan page, then dispatch again with"
            echo "\`yes\`."
            echo
            echo "Neither counter has moved."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ inputs.platform || 'all' }})
    runs-on: ubuntu-latest
    needs: check-credits
    if: needs.check-credits.outputs.confirmed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: |
          PLATFORM="${{ inputs.platform || 'all' }}"
          eas build --platform "$PLATFORM" --profile production --non-interactive

      # Store submission is OPT-IN and MANUAL only — never on a push to main.
      # Auto-submitting to the App Store / Play on every release merge is both
      # undesirable (a store submission for a CI/config-only change) and was
      # failing every time, because eas.json points the Android submit at
      # ./google-services-key.json, which is gitignored and absent in CI.
      # To ship: run this workflow via "Run workflow" with submit = true, and
      # set the two secrets below.
      - name: Submit to stores
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.submit == 'true' }}
        env:
          # Base64-free raw JSON of the Google Play service account key.
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          # App-specific password for the Apple ID used in eas.json submit config.
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          PLATFORM="${{ inputs.platform || 'all' }}"
          # Materialise the Android key (path referenced by eas.json) only for
          # the duration of the submit; remove it on exit regardless of outcome.
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > ./google-services-key.json
          trap 'rm -f ./google-services-key.json' EXIT
          eas submit --platform "$PLATFORM" --non-interactive --latest

name: Chromatic

# Builds the web Storybook and publishes it to Chromatic for visual
# regression testing and a hosted, shareable Storybook. The on-device
# React Native Storybook is unaffected — Chromatic snapshots the web build
# produced by `pnpm build-storybook` (@storybook/react-native-web-vite).

# ⚠️ NOT on pushes to develop. Every commit that reaches develop arrives
# through a pull request, and that pull request already published a Chromatic
# build for exactly that tree — so the push run re-snapshots work that has just
# been snapshotted, and bills for it. The website repo reached the same
# conclusion about its Storybook job in the same words: four Chromatic builds
# per change instead of two, while telling us nothing new.
#
# ⚠️ main KEEPS its push trigger, and not by omission. The README badge points
# at <https://main--6a2ef191cad660cc8d53a313.chromatic.com>, which is Chromatic's
# permalink to the latest build *on the branch main*. A pull request build is
# filed under its head branch (release/1.3.6, feature/…), never under its base,
# so if nothing ever builds on main that link freezes at whatever was published
# last and then rots. One build per release is the price of the published
# Storybook, and it buys something the PR builds do not.
#
# The one thing the dropped develop run was quietly covering: Dependabot pull
# requests are skipped below (no project token), so a dependency bump gets its
# first visual check on the next push to main rather than on the merge to
# develop. Later, not never.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    # Dependabot PRs run without repository secrets, so the project token
    # would be empty — skip them (same pattern as ci.yml / e2e.yml).
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Chromatic needs full git history to find the baseline build.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to Chromatic
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          # Don't fail CI on visual diffs — review/accept baselines in the
          # Chromatic UI (consistent with the repo's non-blocking quality
          # gates). Flip to false later to make UI changes block merges.
          exitZeroOnChanges: true
          # TurboSnap: only re-snapshot stories whose code actually changed,
          # to conserve the monthly snapshot quota.
          #
          # ⚠️ It is not a cap. TurboSnap falls back to a FULL build by design
          # whenever package.json or .storybook/** changes, because it can no
          # longer trust the Vite dependency graph — so every Dependabot bump
          # and every Storybook config tweak snapshots every story. That is
          # cheap today (two stories) and stops being cheap silently as stories
          # are added, which is the reason the trigger above is kept narrow
          # rather than leaning on onlyChanged to do the saving.
          onlyChanged: true

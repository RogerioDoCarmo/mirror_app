appId: com.rogeriodocarmo.miroji
---
# Start from a clean install, so this flow always begins as a NEW user (the
# pinch-to-zoom hint is only shown to someone who has never seen it) and does
# not depend on the other flows.  clearState wipes the "hint seen" marker files
# (zoom-hint-seen and flip-hint-seen) along with the rest of the app's data.
#
# The camera permission is granted by a SECOND launch, not this one: on the iOS
# simulator clearState resets the permission, so combining `clearState` with
# `permissions: camera: allow` in one launchApp leaves the app on the permission
# screen (the first CI run of this flow ended exactly there).  See
# mirror_permission_flow.yaml, which uses the same two-step launch.  The first
# launch leaves the markers absent: a hint is only recorded once it is shown.
- launchApp:
    clearState: true
    permissions:
      camera: unset

- launchApp:
    permissions:
      camera: allow

# CI runners are slow; see mirror_camera_flow.yaml for the 120 s rationale.
#
# The pinch hint is on screen for only a few seconds, so it is the FIRST thing
# waited for: it appears the moment the camera screen does.  The match is by
# testID (`id:`), NOT by text, because the hint's wording is localised and the
# CI device's locale is not guaranteed to be English.
- extendedWaitUntil:
    visible:
      id: 'zoom-hint'
    timeout: 120000

- takeScreenshot: zoom-hint-shown

# The flip hint ("tap to see yourself as others do") waits for the zoom hint to
# go away, so it turns up about five seconds later and is also on screen for
# only a few.  It is matched by testID for the same reason as the zoom hint.
# That the two never share the screen is covered by the MirrorScreen integration
# test; asserting it here would race the zoom hint's own five-second timer.
- extendedWaitUntil:
    visible:
      id: 'flip-hint'
    timeout: 60000

- takeScreenshot: flip-hint-shown

# The hint ignores touches, so pressing the button underneath its pill reaches
# the button: the preview flips and the hint goes away, because the user has
# found what it was pointing at.
- tapOn:
    id: 'mirror-toggle-button'

- assertNotVisible:
    id: 'flip-hint'

- assertVisible:
    text: 'camera-view'

# Back to the mirror view, so the rest of the flow starts from the default.
- tapOn:
    id: 'mirror-toggle-button'

- extendedWaitUntil:
    visible:
      text: 'camera-view'
    timeout: 120000

# The floating controls are matched by testID (`id:`), NOT by text.  Their
# accessibilityLabel is localised (and the mirror toggle's changes with its
# state), so a text: match would break whenever the CI device is not in English.
# The pinch gesture itself cannot be driven by Maestro; its behaviour is covered
# by unit and integration tests.
- assertVisible:
    id: 'camera-flip-button'

- assertVisible:
    id: 'mirror-toggle-button'

# The flashlight belongs to the back camera; the app starts on the front one.
- assertNotVisible:
    id: 'torch-button'

- takeScreenshot: controls-initial

# Tapping the camera switch must keep the preview on screen (the camera
# re-initialises for the other lens).
- tapOn:
    id: 'camera-flip-button'

- extendedWaitUntil:
    visible:
      text: 'camera-view'
    timeout: 60000

# The controls are still there and tappable after the switch.
- assertVisible:
    id: 'camera-flip-button'

# The back camera offers the flashlight.  Whether the emulator has a flash unit
# is beside the point: the button must be there, and pressing it must leave the
# app running with the preview on screen.
- assertVisible:
    id: 'torch-button'

- tapOn:
    id: 'torch-button'

- assertVisible:
    text: 'camera-view'

- assertVisible:
    id: 'torch-button'

# And off again.
- tapOn:
    id: 'torch-button'

# Flipping the preview is a pure visual change: the camera stays mounted.
- tapOn:
    id: 'mirror-toggle-button'

- assertVisible:
    text: 'camera-view'

- assertVisible:
    id: 'mirror-toggle-button'

# And back again.
- tapOn:
    id: 'mirror-toggle-button'

# Back to the front camera: the flashlight goes away with the back camera.
- tapOn:
    id: 'camera-flip-button'

- assertVisible:
    text: 'camera-view'

- assertNotVisible:
    id: 'torch-button'

- takeScreenshot: controls-final

# A second launch (app data kept) must NOT show either hint again: both were
# recorded as seen on the first one.  camera-view appears at the very moment a
# hint would (neither has to wait for the other now), so once it is visible a
# hint is certainly absent if it is not there.
- launchApp:
    permissions:
      camera: allow

- extendedWaitUntil:
    visible:
      text: 'camera-view'
    timeout: 120000

- assertNotVisible:
    id: 'zoom-hint'

- assertNotVisible:
    id: 'flip-hint'
